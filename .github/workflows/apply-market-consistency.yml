name: Apply and verify market consistency
on:
  push:
    branches: [fix/market-data-consistency-20260915]
    paths: [scripts/apply_market_consistency_patch.py]
permissions:
  contents: write
concurrency:
  group: apply-market-consistency
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  repair:
    if: github.ref == 'refs/heads/fix/market-data-consistency-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply reviewed patch
        run: python scripts/apply_market_consistency_patch.py
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        id: install
        continue-on-error: true
        run: |
          uv sync --locked
          npm ci --prefix frontend
      - name: Format and check changed frontend files
        id: format
        continue-on-error: true
        run: |
          { git diff --name-only 5a5914c511a8d5ddeecc97e76d692bc3259c685c -- frontend; git ls-files --others --exclude-standard frontend; } | sort -u | grep -E '\.(ts|tsx|css)$' | sed 's|^frontend/||' > /tmp/market-format-files
          cd frontend
          for attempt in 1 2 3; do
            xargs -r ./node_modules/.bin/prettier --write < /tmp/market-format-files
            if xargs -r ./node_modules/.bin/prettier --check < /tmp/market-format-files; then break; fi
          done
          xargs -r ./node_modules/.bin/prettier --check < /tmp/market-format-files
      - name: Backend regression
        id: backend
        continue-on-error: true
        run: uv run --locked --offline python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee /tmp/market-backend.log
      - name: Frontend build
        id: build
        continue-on-error: true
        working-directory: frontend
        run: npm run build 2>&1 | tee /tmp/market-build.log
      - name: Frontend regression
        id: frontend
        continue-on-error: true
        working-directory: frontend
        run: npm test -- --run 2>&1 | tee /tmp/market-frontend.log
      - name: Targeted browser regression with API fixtures
        id: browser
        continue-on-error: true
        working-directory: frontend
        run: |
          command -v google-chrome || npx --no-install playwright install --with-deps chrome
          npm run test:e2e -- e2e/market-consistency.spec.ts --reporter=list 2>&1 | tee /tmp/market-browser.log
      - name: Record outcomes and publish tested sources
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          FORMAT_RESULT: ${{ steps.format.outcome }}
          BACKEND_RESULT: ${{ steps.backend.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          FRONTEND_RESULT: ${{ steps.frontend.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python scripts/apply_market_consistency_patch.py --record-results
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend scripts frontend tests docs README.md
          git diff --cached --stat
          git commit -m '【修复】【市场】完成失败状态同步与端到端回归' -m '同步失败后的真实关联状态，补齐关系与图表交互测试，将实际检查结果维护在原阶段计划中。'
          git fetch origin fix/market-data-consistency-20260915
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git push origin HEAD:refs/heads/fix/market-data-consistency-20260915
      - name: Verify outcomes
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          FORMAT_RESULT: ${{ steps.format.outcome }}
          BACKEND_RESULT: ${{ steps.backend.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          FRONTEND_RESULT: ${{ steps.frontend.outcome }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
        run: test "$INSTALL_RESULT" = success && test "$FORMAT_RESULT" = success && test "$BACKEND_RESULT" = success && test "$BUILD_RESULT" = success && test "$FRONTEND_RESULT" = success && test "$BROWSER_RESULT" = success
