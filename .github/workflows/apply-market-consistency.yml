name: Apply and verify market consistency
on:
  push:
    branches: [fix/market-data-consistency-20260915]
    paths: [scripts/apply_market_consistency_patch.py]
permissions:
  contents: write
concurrency:
  group: apply-market-consistency
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  repair:
    if: github.ref == 'refs/heads/fix/market-data-consistency-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply reviewed patch
        id: apply
        run: python scripts/apply_market_consistency_patch.py
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          enable-cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        id: install
        continue-on-error: true
        run: |
          uv sync --locked
          npm ci --prefix frontend
      - name: Format modified frontend files
        id: format
        continue-on-error: true
        run: |
          { git diff --name-only -- frontend; git ls-files --others --exclude-standard frontend; } | sort -u | grep -E '\.(ts|tsx|css)$' | sed 's|^frontend/||' > /tmp/market-format-files
          cd frontend
          xargs -r npx --no-install prettier --write < /tmp/market-format-files
          xargs -r npx --no-install prettier --check < /tmp/market-format-files
      - name: Backend regression
        id: backend
        continue-on-error: true
        run: uv run --locked --offline python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee /tmp/market-backend.log
      - name: Frontend build
        id: build
        continue-on-error: true
        working-directory: frontend
        run: npm run build 2>&1 | tee /tmp/market-build.log
      - name: Frontend regression
        id: frontend
        continue-on-error: true
        working-directory: frontend
        run: npm test -- --run 2>&1 | tee /tmp/market-frontend.log
      - name: Record real outcomes and publish repair branch
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          FORMAT_RESULT: ${{ steps.format.outcome }}
          BACKEND_RESULT: ${{ steps.backend.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          FRONTEND_RESULT: ${{ steps.frontend.outcome }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python scripts/apply_market_consistency_patch.py --record-results
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend scripts frontend docs README.md
          git diff --cached --stat
          git commit -m '【修复】【市场】统一行情、关系状态与真实图表口径' -m '修复范围计数、数值和关联校验、部分刷新状态及比较日期，补齐显式序列选择、来源精确行情下钻和联动展示。实现与实际检查同步到原设计及计划，不升级为正式投资推荐。'
          git fetch origin fix/market-data-consistency-20260915
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git push origin HEAD:refs/heads/fix/market-data-consistency-20260915
          printf 'Install: %s\nFormat: %s\nBackend: %s\nBuild: %s\nFrontend: %s\n' "$INSTALL_RESULT" "$FORMAT_RESULT" "$BACKEND_RESULT" "$BUILD_RESULT" "$FRONTEND_RESULT" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify outcomes
        env:
          INSTALL_RESULT: ${{ steps.install.outcome }}
          FORMAT_RESULT: ${{ steps.format.outcome }}
          BACKEND_RESULT: ${{ steps.backend.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          FRONTEND_RESULT: ${{ steps.frontend.outcome }}
        run: test "$INSTALL_RESULT" = success && test "$FORMAT_RESULT" = success && test "$BACKEND_RESULT" = success && test "$BUILD_RESULT" = success && test "$FRONTEND_RESULT" = success
